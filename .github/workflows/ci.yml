# The guards this repo already had, actually running.
#
# `typecheck`, `lint`, `test`, `test:e2e`, `db:check-compliance` and
# `db:check-auth` all existed and were all good. None of them ran unattended.
# Vercel deploys every push to main, and only a hard type error stops it — via
# `next build` — so a lint violation, a failing test, or a §8 compliance
# regression shipped to production unnoticed.
#
# Two places in the repo already asserted this workflow existed:
# scripts/check-compliance.mts ("Run in CI wherever DATABASE_URL is available")
# and CLAUDE.md ("CI and the unit tests cannot drift"). They were describing
# something that was not there. Now they are right.
#
# A Postgres service rather than a Neon branch: the database steps here are
# migrations, org isolation and RLS policies, none of which exercise anything
# Neon-specific, and a service container needs no secret, costs nothing and
# cannot be pointed at production by mistake.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; no point finishing a run nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/growth_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/growth_test
      # The app refuses to boot on an empty allowlist (src/lib/auth.ts), which is
      # deliberate — an access control that can be widened from inside the
      # application is a privilege-escalation path.
      ALLOWED_EMAIL_DOMAINS: example.com
      BETTER_AUTH_SECRET: ci-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3001
      DEFAULT_ORG_SLUG: kognoz-konverz
      # src/lib/auth.ts throws at IMPORT without these, so `next build` cannot
      # even evaluate a route module. Placeholders: nothing here signs in through
      # Microsoft — the E2E helper mints its own session row and signs the cookie
      # with BETTER_AUTH_SECRET, which is the only reason these tests can run at
      # all against an SSO-only app. MICROSOFT_TENANT_ID is left unset because it
      # defaults to "common", which passes the GUID-or-alias check.
      MICROSOFT_CLIENT_ID: ci-placeholder-client-id
      MICROSOFT_CLIENT_SECRET: ci-placeholder-client-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # --frozen-lockfile so a lockfile that disagrees with package.json fails
      # here rather than resolving to something nobody tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Pure, offline, ~1s. The eslint config forbids src/domain from importing
      # @/db, @/lib or @/engine, tests included, which is what keeps it that way.
      - name: Unit tests
        run: pnpm test

      # Every migration, in order, against an empty database. Catches a migration
      # that only works against the one database it was written on — and 0011,
      # 0012 and 0014 rewrite stored data, so there is no down-migration to fall
      # back on if one is wrong.
      - name: Migrate
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      # PRD §8: the `people` table must hold no contact-shaped column. Scans
      # information_schema, views included, using the same regex the unit tests
      # exercise — so the check and the tests cannot drift.
      - name: Compliance check (PRD §8)
        run: pnpm db:check-compliance

      # Better Auth's schema is generated by its CLI; this catches drift between
      # what the library expects and what the migrations built.
      - name: Auth schema check
        run: pnpm db:check-auth

      # Two orgs in one database, asserting no loader shows either org the
      # other's rows, plus the RLS policies denying as the NOBYPASSRLS role.
      # Neither is coverable by the unit suite, which never opens a connection.
      - name: Integration tests (org isolation, RLS)
        run: pnpm test:integration

      # Last, because it is the slowest and the most likely to be flaky, and
      # everything above it is a faster signal for the same push.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # Backgrounded with nohup so the step can exit while the server keeps
      # running for the steps after it.
      - name: Start the app
        run: nohup pnpm start --port 3001 > server.log 2>&1 &

      # A curl loop rather than a `wait-on` dependency: this is the only place
      # that would need it, and a dependency added for one CI step is a
      # dependency to keep patched forever.
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3001/sign-in; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the app did not start:"; cat server.log; exit 1

      - name: E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            server.log
          retention-days: 7
